<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주대학교 해양과학대학 교원·조교 규정 AI 어시스턴트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <span class="bg-blue-600 text-xs font-semibold px-2.5 py-1 rounded-full">JNU</span>
                <span class="text-xs text-slate-400 ml-2">기준: 2026. 9. 11.</span>
                <h1 class="text-xl font-bold mt-1">해양과학대학 교원·조교 규정 및 학사행정 챗봇</h1>
            </div>
            <p class="text-xs text-slate-400 mt-2 sm:mt-0 text-right">승진·임용, 수업, 복무·출장, 연구비 규정 안내</p>
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-1 flex flex-col">
        <div id="chat-box" class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 p-4 sm:p-6 mb-4 overflow-y-auto space-y-4 h-[63vh]">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3">
                <div class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0">AI</div>
                <div class="bg-slate-100 rounded-2xl p-4 text-slate-800 text-sm sm:text-base max-w-[85%] leading-relaxed">
                    <p class="font-semibold text-blue-900 mb-1">안녕하십니까! 제주대학교 해양과학대학 규정 AI 어시스턴트입니다.</p>
                    <p>책임시수, 보직자 감면, 승진·재임용, 원격수업, 성적 처리, 복무·휴가, 출장 및 예산 집행에 대해 자유롭게 질문해 주시면 정확한 근거 조항과 함께 안내해 드립니다.</p>
                </div>
            </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="mb-3 flex overflow-x-auto pb-2 space-x-2 scrollbar-none">
            <button onclick="sendQuickQuery('주당 강의 책임시간과 대면 강의 조건이 어떻게 되나요?')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">📚 책임시수 및 전공대면</button>
            <button onclick="sendQuickQuery('학장 보직자나 보직 수행 시 책임시수 감면 기준은?')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">⚖️ 보직자 및 책임시수 감면</button>
            <button onclick="sendQuickQuery('부교수에서 정교수 승진 요건과 소요연수가 궁금해요')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">🏆 승진·재임용 요건</button>
            <button onclick="sendQuickQuery('국외출장 신청 기한과 귀국 후 보고 규정은요?')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">✈️ 국외출장 및 여비</button>
            <button onclick="sendQuickQuery('법인(클린)카드 사용 제한 업종과 증빙 기준')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">💳 클린카드 및 예산집행</button>
            <button onclick="sendQuickQuery('원격수업 동영상 콘텐츠 제작 시간 기준')" class="bg-white border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-50 transition">💻 원격수업 운영 기준</button>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="규정에 대해 자유롭게 질문하세요 (예: 출장 보고는 며칠 안에 해야 하나요?)" class="flex-1 bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="handleKeyPress(event)">
            <button onclick="handleUserSubmit()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl text-sm transition shrink-0">질문</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        제주대학교 해양과학대학 · 교무행정 통합 안내 시스템
    </footer>

    <!-- Advanced Generative-Style Static Engine -->
    <script>
        const knowledgeBase = [
            {
                id: "exemption",
                triggers: ["학장", "보직", "감면", "처장", "원장", "면제", "기피시간", "학과장", "부처장", "부단장", "주당 3시간", "주당 6시간"],
                title: "보직교원 책임시수 감면(조정) 기준",
                core: "본부 실·처·원장 및 단과대학장 등 보직 수행 교원의 경우 공무 수행을 위하여 책임시수가 감면(조정)됩니다.",
                details: [
                    "<b>주당 3시간 감면 대상:</b> 학장, 처장, 기획실장, 산학협력단장 등",
                    "<b>주당 6시간 감면 대상:</b> 학과장(전공주임), 부처장, 부단장, 대학원 부원장 등",
                    "<b>필수 유의사항:</b> 보직 수행으로 책임시수가 감축되더라도 매 학기 '학부 수업 1강좌 이상'은 반드시 담당해야 합니다."
                ],
                basis: "제주대학교 수업시간표 편성 및 수업 운영에 관한 지침 제4조 제5항"
            },
            {
                id: "teaching_load",
                triggers: ["책임시수", "강의", "대면", "시간", "시수", "주당", "분산", "9시간", "18시간", "학부 4시간", "수업시간"],
                title: "전임교원 주당 강의 책임시간 및 대면 수업 기준",
                core: "전임교원의 주당 강의 책임시간은 기본 9시간(연간 18시간)이며, 대학 수업 운영 기준을 준수해야 합니다.",
                details: [
                    "<b>학기별 이수 기준:</b> 매 학기 학부 4시간 이상을 포함하여 학기당 5시간 이상 담당",
                    "<b>전공 대면 필수:</b> 이 중 2시간 이상은 전공과목으로 대면 강의 진행 필수",
                    "<b>강의 편성:</b> 주 3일 이상 분산하여 강의를 담당하도록 편성"
                ],
                basis: "제주대학교 수업시간표 편성 및 수업 운영에 관한 지침 제4조 제6항 및 제8항"
            },
            {
                id: "remote_class",
                triggers: ["원격", "동영상", "콘텐츠", "온라인", "LMS", "블렌디드", "플립드", "강좌", "비전임"],
                title: "학내 원격수업 및 블렌디드러닝 운영 기준",
                core: "원격수업 및 블렌디드 강좌 운영 시 콘텐츠 제작 및 LMS 탑재 규정을 엄격히 준수해야 합니다.",
                details: [
                    "<b>콘텐츠 제작 기준:</b> 1차시당 재생 시간 25분±15분 (75분제 적용 시 45분±15분)",
                    "<b>LMS 탑재 필수:</b> JNUclass LMS에 사전 탑재 (단순 외부 링크 등록 불가)",
                    "<b>학습 인정 시간:</b> 질의응답 및 토론을 포함하여 총 학습시간(50분 또는 75분) 충족 필요"
                ],
                basis: "제주대학교 원격수업 운영 지침 제6조 및 제9조"
            },
            {
                id: "promotion",
                triggers: ["승진", "재임용", "소요연수", "부교수", "정교수", "조교수", "업적평가", "환산율", "연구실적", "과락"],
                title: "전임교원 승진 및 재임용 소요연수·업적평가 기준",
                core: "교원 인사규정 및 해양과학대학 교수업적평가 세부지침에 따라 승진 및 재임용 요건을 심사합니다.",
                details: [
                    "<b>소요연수:</b> 조교수 4년, 부교수 6년",
                    "<b>업적평가 기준:</b> 교육, 연구, 봉사 영역별 기준 점수 및 환산율 충족 필수"
                ],
                basis: "제주대학교 교원인사규정 및 해양과학대학 교수업적평가 세부지침"
            },
            {
                id: "business_trip",
                triggers: ["출장", "국외", "여비", "보고", "마일리지", "항공", "국내출장", "정산", "체재비", "보고서"],
                title: "국내·외 출장 승인 및 여비 정산·보고 규정",
                core: "출장은 사전에 승인을 받아야 하며, 규정에 따라 여비 정산 및 결과 보고를 완료해야 합니다.",
                details: [
                    "<b>사전 승인:</b> 출장신청서 및 관련 증빙(회의 공문 등) 사전 제출 필수",
                    "<b>항공 마일리지:</b> 국외출장 시 공적 항공마일리지 우선 사용",
                    "<b>정산 및 보고 기한:</b> 귀국 후 2주일 이내 여비 정산 완료, <b>국외출장보고서는 귀국 후 30일 이내 등록</b>"
                ],
                basis: "공무원 여비 규정 및 2026학년도 대학회계 예산집행 지침"
            },
            {
                id: "card_budget",
                triggers: ["카드", "클린카드", "예산", "업무추진비", "법인카드", "집행", "50만", "제한업종", "상품권", "심야", "주말"],
                title: "대학회계 예산집행 및 법인(클린)카드 사용 지침",
                core: "예산 집행 시 클린카드 사용 제한 업종 및 고액 지출 증빙 기준을 철저히 준수해야 합니다.",
                details: [
                    "<b>사용 제한 업종/시간:</b> 유흥·레저·사행업종 및 법정공휴일·주말·심야시간대(22시 이후) 사용 원칙적 제한",
                    "<b>고액 지출 증빙:</b> 건당 50만 원 이상 집행 시 주된 상대방의 소속 및 성명 기재 필수"
                ],
                basis: "2026학년도 대학회계 예산집행 기본지침 III. 비목별 지침(업무추진비)"
            },
            {
                id: "grades",
                triggers: ["성적", "평가", "상대평가", "절대평가", "재이수", "경고", "S/U", "학점", "이의신청", "정정"],
                title: "교과목 성적 평가 및 성적경고·정정 처리 지침",
                core: "성적 평가는 규정된 산출 구간과 원칙에 따르며, 임의 정정은 엄격히 금지됩니다.",
                details: [
                    "<b>성적 평가:</b> 상대평가 I·II 및 절대평가 구분 (기말시험 시작일 기준 수강인원 구간별 소수점 버림)",
                    "<b>성적 경고:</b> 평점평균 1.3 미만인 경우 성적경고 부여",
                    "<b>성적 정정:</b> 임의 정정 불가하며 오류 발생 시 사유서 및 증빙자료 첨부하여 총장 승인 필요"
                ],
                basis: "제주대학교 성적업무 처리 지침 제2조~제7조 및 제13조"
            },
            {
                id: "welfare_duty",
                triggers: ["겸직", "외부강의", "초과강의", "사외이사", "신고", "복무", "휴가", "병가", "연가", "초과근무", "특근매식비"],
                title: "교직원 복무, 휴가, 겸직 및 초과근무 지침",
                core: "국가공무원 복무 규정 및 대학 인사 지침에 따라 복무와 겸직 사항을 관리해야 합니다.",
                details: [
                    "<b>복무 및 휴가:</b> 병가, 연가 등은 사전에 시스템(KORUS 등)을 통해 신청·승인",
                    "<b>겸직 및 외부강의:</b> 대가성 외부강의·강연 등은 마친 날부터 <b>10일 이내 신고</b> 필수",
                    "<b>초과근무 및 매식비:</b> 2시간 이상 초과근무 시 규정에 따른 수당 및 특근매식비 청구 가능"
                ],
                basis: "국가공무원 복무·징계 예규 및 제주대학교 교원 인사규정"
            }
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleUserSubmit();
        }

        function sendQuickQuery(query) {
            document.getElementById('user-input').value = query;
            handleUserSubmit();
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const isAI = sender === 'AI';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isAI ? '' : 'flex-row-reverse space-x-reverse'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `${isAI ? 'bg-blue-600' : 'bg-slate-700'} text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0`;
            avatar.innerText = isAI ? 'AI' : '교원';
            
            const bubble = document.createElement('div');
            bubble.className = `${isAI ? 'bg-slate-100 text-slate-800' : 'bg-blue-600 text-white'} rounded-2xl p-4 text-sm sm:text-base max-w-[85%] leading-relaxed shadow-sm`;
            bubble.innerHTML = text;
            
            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 생성형 AI 스타일의 복합 문맥 분석 매칭 엔진
        function handleUserSubmit() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage('USER', query);
            input.value = '';

            setTimeout(() => {
                let bestMatch = null;
                let highestScore = 0;

                // 문장 속 키워드 일치 점수 산정 (가중치 부여)
                knowledgeBase.forEach(item => {
                    let score = 0;
                    item.triggers.forEach(trigger => {
                        if (query.includes(trigger)) {
                            // 단어 길이에 비례하고 핵심 단어일수록 높은 가중치 부여
                            let weight = trigger.length >= 2 ? trigger.length * 2 : 2;
                            if (["학장", "감면", "출장", "보고", "승진", "클린카드", "원격", "겸직", "성적"].includes(trigger)) {
                                weight += 10;
                            }
                            score += weight;
                        }
                    });
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = item;
                    }
                });

                let responseHTML = "";
                if (bestMatch && highestScore > 3) {
                    // 생성형 답변 형태로 구조화하여 출력
                    responseHTML = `<p class="font-semibold text-blue-900 mb-2">📌 ${bestMatch.title}</p>`;
                    responseHTML += `<p class="mb-3">${bestMatch.core}</p>`;
                    if (bestMatch.details && bestMatch.details.length > 0) {
                        responseHTML += `<ul class="list-disc pl-5 space-y-1 mb-3 text-slate-700">`;
                        bestMatch.details.forEach(detail => {
                            responseHTML += `<li>${detail}</li>`;
                        });
                        responseHTML += `</ul>`;
                    }
                    responseHTML += `<div class="mt-2 pt-2 border-t border-slate-200 text-xs text-slate-500"><b>[근거 조항]</b> ${bestMatch.basis}</div>`;
                } else {
                    responseHTML = `문의하신 내용과 관련된 해양과학대학 규정 데이터를 확인하였습니다. 질문하신 표현보다는 <b>'책임시수 감면', '국외출장 보고', '클린카드 제한', '원격수업 기준', '성적 정정', '겸직 신고'</b> 등의 핵심 키워드 중심으로 질문해 주시면 더욱 정확하고 상세한 조문을 안내해 드립니다.`;
                }

                appendMessage('AI', responseHTML);
            }, 400);
        }
    </script>
</body>
</html>
